[workspace]
members = ["main", "business", "web", "api", "ldap", "template", "sqlite", "test-fixtures"]
resolver = "2"

[workspace.package]
version = "2.1.1"
authors = ["Jan Veen <jan.veen@posteo.de>"]
description = "Tiny OIDC Provider"
homepage = "https://veenj.de/git/veenj/tiny-auth/src/branch/master/README.md"

license = "GPL-3.0-or-later"
edition = "2024"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1

[workspace.dependencies]
clap = "4.3.8"
serde_derive = "1.0.164"
serde_yaml = "0.9.22"
serde_json = "1.0.99"
serde_urlencoded = "0.7.1"
chrono = "0.4.15"
regex = "1.3.9"
actix-rt = "2.8.0"
actix-session = { version = "0.11", features = ["cookie-session"] }
actix-files = "0.6.2"
tower-http = { version = "0.6.8", features = ["cors"] }
tower = { version = "0.5.3" }
pin-project-lite = "0.2.13"
http = "1.4.0"
url = { version = "2.1.1", features = ["serde"] }
futures = "0.3"
tera = "1.5.0"
base64 = "0.22"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"]}
rand = "0.10"
async-trait = "0.1.40"
rustls-pemfile = "2"
test-log = "0.2.12"
env_logger = "0.11.3"
systemd = "0.10.0"
tonic = { version = "0.14.5", features = ["transport", "tls-aws-lc"] }
tonic-reflection = "0.14.5"
tonic-prost = "0.14.5"
tonic-web = "0.14.5"
prost = "0.14.3"
tonic-prost-build = "0.14.5"
thiserror = "2"
ldap3 = { version = "0.12.1", default-features = false, features = ["sync", "tls-rustls-aws-lc-rs"] }
testcontainers = { version = "0.27", default-features = false, features = ["aws-lc-rs"]}
pretty_assertions = "1.4.0"
rstest = "0.26"
enum_dispatch = "0.3.13"
futures-util = "0.3.30"
moka = { version = "0.12.7", features = ["future"] }
tracing-log = "0.2.0"
lazy_static = "1.5.0"
itertools = "0.14"
mockall = "0.14"

[workspace.dependencies.rustls]
version = "0.23.11"
default-features = false
features = ["aws-lc-rs", "logging", "prefer-post-quantum", "std", "tls12"]

[workspace.dependencies.tracing-actix-web]
version = "0.7"
features = ["opentelemetry_0_23", "emit_event_on_error"]

[workspace.dependencies.openssl]
version = "0.10"
features = ["v110"]

[workspace.dependencies.ring]
version = "0.17"
features = ["alloc", "std"]

[workspace.dependencies.tokio]
version = "1.28.2"
features = ["full"]

[workspace.dependencies.tokio-stream]
version = "0.1.14"
features = ["net"]

[workspace.dependencies.actix-web]
version = "4.8.0"
features = ["rustls-0_23"]

[workspace.dependencies.uuid]
version = "1.3.4"
features = ["v4", "serde"]

[workspace.dependencies.serde]
version = "1.0.164"
features = ["derive"]

[workspace.dependencies.tracing-subscriber]
version = "0.3.18"
default-features = false
features = ["std", "env-filter", "fmt", "ansi", "registry", "json", "chrono", "parking_lot"]

[workspace.dependencies.tracing]
version = "0.1.40"
default-features = false
features = ["attributes", "std"]

[workspace.dependencies.vergen-git2]
version = "9"
features = ["build"]

[workspace.dependencies.notify]
version = "8"
default-features = false
features = ["macos_kqueue"]

[workspace.dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio", "sqlite", "macros"]

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
panic = "deny"
unreachable = "deny"
str_to_string = "deny"
allow_attributes_without_reason = "deny"
all = "deny"
